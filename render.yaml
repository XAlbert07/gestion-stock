# API Express hébergée sur Render. La base PostgreSQL est hébergée chez Neon
# (plan gratuit permanent) : ses paramètres de connexion se saisissent dans le
# dashboard Render (variables marquées sync: false), jamais dans ce fichier.
services:
  - type: web
    name: gestion-stock-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    # start:render enchaîne, à chaque démarrage : migrations, création de
    # l'administrateur (si ADMIN_PASSWORD est défini), création du compte visiteur
    # (si DEMO_LOGIN_ENABLED=true) et données de démonstration (si SEED_DEMO=true et
    # base sans produit). Voir backend/package.json.
    startCommand: npm run start:render
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      # --- Base PostgreSQL (Neon) ---
      - key: DB_HOST
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_PORT
        value: 5432
      # Connexion chiffrée obligatoire chez Neon
      - key: DB_SSL
        value: true
      # --- Application ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: TRUST_PROXY_HOPS
        value: 1
      # Données de démonstration (boutique générale). Supprimer cette variable pour désactiver.
      - key: SEED_DEMO
        value: true
      # Bouton « Explorer la démo » : connexion en un clic à un compte en lecture seule.
      # Supprimer cette variable pour désactiver la démo.
      - key: DEMO_LOGIN_ENABLED
        value: true
      # Pour (re)créer le compte administrateur : ajouter dans le dashboard
      # ADMIN_FIRST_NAME, ADMIN_LAST_NAME, ADMIN_EMAIL et ADMIN_PASSWORD (12 caractères
      # minimum), laisser redémarrer, puis supprimer ADMIN_PASSWORD.
