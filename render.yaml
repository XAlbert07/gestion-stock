databases:
  - name: gestion-stock-db
    plan: free
    databaseName: gestion_stock
    user: gestion_stock_user

services:
  - type: web
    name: gestion-stock-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    # Migrations à chaque démarrage. Le seed de démonstration ne s'exécute que si
    # SEED_DEMO=true ET que la base ne contient aucun produit. Le compte visiteur
    # (lecture seule) est créé si DEMO_LOGIN_ENABLED=true. Un échec de l'un ou de
    # l'autre ne bloque jamais le démarrage de l'API.
    startCommand: npm run db:migrate && (npm run db:seed:demo -- --if-empty || true) && (npm run bootstrap:demo || true) && npm start
    healthCheckPath: /api/health/ready
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        fromDatabase:
          name: gestion-stock-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: gestion-stock-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: gestion-stock-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: gestion-stock-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: gestion-stock-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      - key: TRUST_PROXY_HOPS
        value: 1
      # Données de démonstration (boutique générale). Supprimer cette variable pour désactiver.
      - key: SEED_DEMO
        value: true
      # Bouton « Explorer la démo » : connexion en un clic à un compte en lecture seule.
      # Supprimer cette variable pour désactiver la démo.
      - key: DEMO_LOGIN_ENABLED
        value: true
