name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: gestion_stock_test
          POSTGRES_USER: gestion_stock_test
          POSTGRES_PASSWORD: gestion_stock_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gestion_stock_test -d gestion_stock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: gestion_stock_test
      DB_USER: gestion_stock_test
      DB_PASSWORD: gestion_stock_test_password
      JWT_SECRET: ci-only-secret-with-more-than-thirty-two-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm audit --audit-level=high
        working-directory: backend
      - run: npm run db:migrate
        working-directory: backend
      - run: npm run check
        working-directory: backend
      - run: npx jest --runInBand --runTestsByPath tests/inventory.postgres.integration.test.js
        working-directory: backend
        env:
          RUN_POSTGRES_INTEGRATION: "1"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
